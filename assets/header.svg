<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420">
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
    <radialGradient id="glow" cx="78%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#6EE7B7" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#6EE7B7" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="card"><rect width="1200" height="420" rx="24"/></clipPath>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", "Malgun Gothic", Helvetica, Arial, sans-serif; }
      .mono { font-family: "SF Mono", "JetBrains Mono", ui-monospace, Menlo, Consolas, "DejaVu Sans Mono", monospace; }
      .line { opacity: 0; animation: in .5s ease-out forwards; }
      .l1 { animation-delay: .3s; } .l2 { animation-delay: 1.1s; } .l3 { animation-delay: 1.9s; }
      .l4 { animation-delay: 2.7s; } .l5 { animation-delay: 3.5s; }
      .cursor { animation: blink 1s steps(1) infinite; }
      @keyframes in { from { opacity: 0; transform: translateX(-6px); } to { opacity: 1; transform: none; } }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="420" fill="#0B0C0F"/>
    <rect width="1200" height="420" fill="url(#dots)"/>
    <rect width="1200" height="420" fill="url(#glow)"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="419" rx="24" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>

  <!-- left: identity -->
  <text x="64" y="104" class="mono" font-size="14" letter-spacing="3" fill="#6EE7B7">AI / BACKEND ENGINEER</text>
  <text x="62" y="186" class="sans" font-size="72" font-weight="700" letter-spacing="-2" fill="#F4F4F5">Inho Choi</text>
  <text x="66" y="230" class="sans" font-size="24" font-weight="500" fill="#71717A">최인호</text>
  <text x="64" y="294" class="sans" font-size="30" font-weight="600" letter-spacing="-0.6" fill="#E4E4E7">폐쇄망 음성 AI 파이프라인 E2E <tspan fill="#6EE7B7">有</tspan></text>
  <text x="64" y="332" class="sans" font-size="20" fill="#A1A1AA">요즘은 에이전트에 관심 <tspan fill="#6EE7B7" font-weight="600">多</tspan></text>
  <text x="64" y="366" class="mono" font-size="14" fill="#52525B">python · fastapi · pytorch · langgraph · airflow</text>

  <!-- right: agent trace -->
  <rect x="704" y="72" width="432" height="276" rx="14" fill="#111317" stroke="#ffffff" stroke-opacity="0.08"/>
  <circle cx="728" cy="96" r="5" fill="#3F3F46"/>
  <circle cx="746" cy="96" r="5" fill="#3F3F46"/>
  <circle cx="764" cy="96" r="5" fill="#3F3F46"/>
  <text x="1112" y="101" text-anchor="end" class="mono" font-size="12" fill="#52525B">agent.log</text>
  <line x1="704" y1="118" x2="1136" y2="118" stroke="#ffffff" stroke-opacity="0.06"/>

  <g class="mono" font-size="15">
    <text x="728" y="156" class="line l1"><tspan fill="#52525B">$ </tspan><tspan fill="#E4E4E7">agent run</tspan><tspan fill="#71717A"> --task triage</tspan></text>
    <text x="728" y="194" class="line l2"><tspan fill="#A1A1AA">plan</tspan><tspan x="808" fill="#71717A">split into 3 steps</tspan></text>
    <text x="728" y="226" class="line l3"><tspan fill="#A1A1AA">act</tspan><tspan x="808" fill="#71717A">read logs · query runbook</tspan></text>
    <text x="728" y="258" class="line l4"><tspan fill="#A1A1AA">verify</tspan><tspan x="808" fill="#71717A">3/3 claims matched to source</tspan></text>
    <text x="728" y="304" class="line l5"><tspan fill="#6EE7B7">✓ grounded</tspan><tspan x="838" fill="#71717A">ready for review</tspan><tspan class="cursor" fill="#6EE7B7"> ▍</tspan></text>
  </g>
</svg>
